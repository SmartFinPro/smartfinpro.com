name: Build & Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # ── Gate: production must not deploy over undetected migration drift ──
  # Runs before the deploy job (deploy `needs` it). A missing Supabase
  # credential OR a genuinely new drift fails this job and blocks the deploy;
  # the 6 baselined known-drifts are tolerated. This is trusted code (push to
  # main), so the credential exposure is safe here — unlike pull_request.
  migration-drift-gate:
    name: Migration drift gate (blocks deploy on new drift / missing creds)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No `npm ci` — the checker is zero-dependency (Node built-ins + fetch).
      - name: Check migration drift against live schema (--strict)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:migrations -- --strict

  deploy:
    name: Build on GitHub → Deploy to Cloudways VPS
    needs: migration-drift-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js Setup ─────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install Dependencies ───────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build Next.js (4GB RAM auf GitHub Actions) ─────────
      - name: Build Next.js
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_INDEXING_JSON: ${{ secrets.GOOGLE_INDEXING_JSON }}

      # ── 5. Copy static assets into standalone ─────────────────
      - name: Prepare standalone output
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      # ── 5b. Write production .env into standalone ──────────────
      - name: Write production .env
        run: |
          cat > .next/standalone/.env <<'EOF'
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}
          DASHBOARD_SECRET=${{ secrets.DASHBOARD_SECRET }}
          DASHBOARD_TOTP_SECRET=${{ secrets.DASHBOARD_TOTP_SECRET }}
          GSC_CLIENT_EMAIL=${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY=${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL=${{ secrets.GSC_SITE_URL }}
          GOOGLE_INDEXING_JSON=${{ secrets.GOOGLE_INDEXING_JSON }}
          RESEND_WEBHOOK_SECRET=${{ secrets.RESEND_WEBHOOK_SECRET }}
          POSTBACK_SECRET=${{ secrets.POSTBACK_SECRET }}
          CJ_API_TOKEN=${{ secrets.CJ_API_TOKEN }}
          PARTNERSTACK_API_KEY=${{ secrets.PARTNERSTACK_API_KEY }}
          PARTNERSTACK_API_SECRET=${{ secrets.PARTNERSTACK_API_SECRET }}
          EOF
          sed -i 's/^[[:space:]]*//' .next/standalone/.env
          echo "✅ .env written ($(wc -l < .next/standalone/.env) lines)"

      # ── 6. (removed) Critical CSS injection ──────────────────
      # The post-build critical-CSS injection was retired 2026-07-06.
      # It was authored for the old dark design; a Node-20 crash kept it
      # a silent no-op in CI for its whole life (continue-on-error hid
      # the failure), and the first time it actually ran in production
      # it caused CLS 0.25 + LCP +0.9s (PageSpeed 92 → 77) because the
      # extracted "critical" subset no longer matched the live design —
      # far worse than the ~300ms of render-blocking CSS it saved.

      # ── 7. SSH Key Setup ──────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ── 8. Backup current standalone (Self-Healing) ─────────
      - name: Backup current standalone
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/master/applications/brvnvntpcj/public_html && \
             rm -rf .next/standalone-backup && \
             if [ -d .next/standalone ]; then \
               cp -a .next/standalone .next/standalone-backup && \
               echo '✅ Backup created'; \
             else \
               echo '⚠️ No existing standalone to backup'; \
             fi"

      # ── 9. Rsync standalone → VPS ─────────────────────────────
      # --exclude '.next/cache/': this dir only exists at runtime on the VPS
      # (sharp-generated AVIF/WebP variants from the image optimizer). It's
      # never part of the fresh build artifact, so a plain --delete wiped it
      # on every deploy, forcing every visitor after a deploy to re-pay the
      # on-demand encode cost for every image/size/format combo. Excluding it
      # lets --delete clean up everything else while this cache persists and
      # keeps warming across deploys.
      - name: Deploy standalone to VPS
        run: |
          rsync -avz --delete --no-perms --no-owner --no-group \
            --exclude='.next/cache/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            .next/standalone/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/master/applications/brvnvntpcj/public_html/.next/standalone/ \
          || RSYNC_EXIT=$?; [ "${RSYNC_EXIT:-0}" -eq 23 ] && echo "⚠️ rsync code 23 (minor permission issues) — continuing" || exit ${RSYNC_EXIT:-0}

      # ── 9b. Sync content directory to VPS ─────────────────────
      # Uses --no-delete: preserves files written by Genesis Hub directly on VPS.
      # New/updated MDX files from git are synced TO VPS. VPS-only Genesis Hub
      # files are never overwritten. This ensures git-committed content reaches
      # APP_ROOT/content/ for dynamic runtime serving (process.cwd()/content/).
      - name: Sync content to VPS
        run: |
          rsync -avz --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            content/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/master/applications/brvnvntpcj/public_html/content/ \
          || RSYNC_EXIT=$?; [ "${RSYNC_EXIT:-0}" -eq 23 ] && echo "⚠️ rsync code 23 (minor permission issues) — continuing" || exit ${RSYNC_EXIT:-0}

      # ── 10. PM2 Restart ───────────────────────────────────────
      # ── 10a. Sync runtime env vars to VPS .env.local ─────────
      # PM2 cwd=APP_ROOT → Next.js reads .env.local from app root (not standalone dir).
      # We must keep .env.local in sync for runtime vars that live only on VPS.
      - name: Sync runtime env to VPS .env.local
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "ENV_FILE=/home/master/applications/brvnvntpcj/public_html/.env.local
             STANDALONE_ENV=/home/master/applications/brvnvntpcj/public_html/.next/standalone/.env

             update_env() { local key=\$1 val=\$2
               if grep -q \"^\${key}=\" \"\$ENV_FILE\" 2>/dev/null; then
                 sed -i \"s|^\${key}=.*|\${key}=\${val}|\" \"\$ENV_FILE\"
               else
                 echo \"\${key}=\${val}\" >> \"\$ENV_FILE\"
               fi
             }

             # Sync all runtime vars from standalone .env to .env.local
             # This ensures vars written by Step 5b reach PM2's working directory
             for KEY in GSC_CLIENT_EMAIL GSC_SITE_URL GOOGLE_INDEXING_JSON RESEND_WEBHOOK_SECRET POSTBACK_SECRET CJ_API_TOKEN PARTNERSTACK_API_KEY PARTNERSTACK_API_SECRET; do
               VAL=\$(grep \"^\${KEY}=\" \"\$STANDALONE_ENV\" 2>/dev/null | head -1 | cut -d= -f2-)
               if [ -n \"\$VAL\" ]; then
                 update_env \"\$KEY\" \"\$VAL\"
               fi
             done

             # GSC_PRIVATE_KEY needs special handling (multiline PEM)
             # Remove old key and copy fresh from standalone .env
             sed -i '/^GSC_PRIVATE_KEY=/d' \"\$ENV_FILE\" 2>/dev/null
             grep '^GSC_PRIVATE_KEY=' \"\$STANDALONE_ENV\" >> \"\$ENV_FILE\" 2>/dev/null

             echo '✅ .env.local synced with all runtime vars'
             grep -c '=' \"\$ENV_FILE\" | xargs -I{} echo '   {} vars in .env.local'"

      - name: Restart PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "export PM2=/home/master/.npm-global/bin/pm2 && \$PM2 restart SmartFinPro-Live --update-env && \$PM2 save"

      # ── 11. Health Check (3 Versuche, je 10s) ────────────────
      - name: Health Check
        id: healthcheck
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'for i in 1 2 3; do
              sleep 10
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed"
                exit 0
              fi
            done
            echo "❌ Health check failed after 3 attempts"
            exit 1'

      # ── 11b-pre. Purge Cloudflare cache BEFORE smoke tests ────
      # Purge EVERYTHING (not just the critical URLs): the CDN smoke test hits hub
      # and review URLs, and a stale/poisoned edge entry there (e.g. a cached RSC
      # text/x-component payload) would false-flag the best-effort CDN check and
      # keep serving the old build to visitors. A clean cache before the smoke
      # tests guarantees the CDN check exercises the new build's origin.
      - name: Purge Cloudflare cache (pre-smoke)
        if: steps.healthcheck.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/purge-cloudflare.mjs --everything

      # ── 11b-warm. Warm-up `/` (best-effort) BEFORE the smoke tests ──
      # After PM2 restart + CF purge, the first CDN hit to `/` is a cache MISS
      # against a freshly-restarted origin → the heavy homepage can render slowly
      # on the very first request, causing a transient smoke-test FAIL (observed
      # on deploy of #19). This probe warms `/` on origin (via SSH) AND CDN with
      # bounded retries so the smoke tests below hit a ready, cached `/`.
      # It NEVER gates the deploy (continue-on-error): the Origin Smoke Test
      # below is the hard gate. A CDN loop that never reaches 200 (e.g. a 403
      # series from a Cloudflare bot challenge) is surfaced as a ::warning::
      # annotation + job-summary entry instead of vanishing in the step log.
      - name: Warm-up `/` before smoke test
        if: steps.healthcheck.outcome == 'success'
        continue-on-error: true
        run: |
          echo "── Warming origin / (via SSH → localhost:3000) ──"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'for i in 1 2 3 4 5 6; do
               S=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
               echo "  origin attempt $i: HTTP $S"
               [ "$S" = "200" ] && { echo "  origin ready"; exit 0; }
               sleep 5
             done
             echo "  origin not 200 after retries (continuing — smoke test is the gate)"; exit 0'
          echo "── Warming CDN / (primes Cloudflare after pre-smoke purge) ──"
          # Same UA as scripts/smoke-test.mjs. NOTE (2026-07-26, run 30208225666):
          # Cloudflare bot-challenges some GH-Actions runner IPs regardless of
          # this UA (full 403 series) — whether the warm-up passes is an
          # IP-reputation lottery, so a no-200 series is reported below.
          CODES=""
          CDN_OK=0
          for i in 1 2 3 4 5 6; do
            S=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: SmartFinPro-SmokeTest/1.0" "${{ secrets.NEXT_PUBLIC_SITE_URL }}/" 2>/dev/null || true)
            [ -n "$S" ] || S="000"
            echo "  cdn attempt $i: HTTP $S"
            CODES="${CODES:+$CODES,}$S"
            [ "$S" = "200" ] && { echo "  cdn ready"; CDN_OK=1; break; }
            sleep 5
          done
          if [ "$CDN_OK" != "1" ]; then
            {
              echo "### ⚠️ CDN-Warm-up blockiert (kein 200 erreicht)"
              echo ""
              echo "Alle Warm-up-Versuche gegen \`/\` via Cloudflare scheiterten — HTTP-Codes: \`${CODES}\`."
              echo "Eine 403-Serie heißt: Cloudflare bot-challengt diese Runner-IP. Der Edge-Cache für \`/\` wurde nicht vorgewärmt; der best-effort CDN-Smoke-Test wird dann meist ebenfalls rot."
              echo "Das Deploy-Gate (Origin-Smoke via SSH) ist davon unabhängig."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=CDN warm-up blocked::No 200 after 6 attempts (HTTP: ${CODES}) — likely Cloudflare bot challenge on this runner IP"
          fi

      # ── 11b-warm-img. Pre-warm hero + tile images referenced on `/` ──
      # The image optimizer (sharp) encodes each image/width/format combo
      # on first request — expensive (0.3-3s+) and, before the --exclude fix
      # above, reset to empty on every deploy. Scrapes every `_next/image`
      # URL out of the just-warmed `/` HTML (no hardcoded image list to rot)
      # and requests each at the common device widths so visitors after this
      # deploy land on an already-warm origin cache instead of paying the
      # encode cost themselves.
      - name: Warm-up homepage images
        if: steps.healthcheck.outcome == 'success'
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'curl -sf http://localhost:3000/ 2>/dev/null \
              | grep -oE "/_next/image\?url=[^\"'"'"'&]*" | sort -u > /tmp/warm-urls.txt
             n=$(wc -l < /tmp/warm-urls.txt)
             if [ "$n" -eq 0 ]; then
               echo "  no _next/image URLs found in / — skipping"; exit 0
             fi
             echo "  found $n distinct image(s) in / — warming x 3 widths x 2 formats"
             while read -r path; do
               for w in 750 1200 1920; do
                 for accept in "image/avif,image/webp,*/*" "image/webp,*/*"; do
                   curl -sf -H "Accept: $accept" -o /dev/null \
                     "http://localhost:3000${path}&w=${w}&q=75" &
                 done
               done
             done < /tmp/warm-urls.txt
             wait
             rm -f /tmp/warm-urls.txt
             echo "  done"'

      # ── 11b. Origin Smoke Test (via SSH) — DEPLOY GATE ────────
      # Runs the full smoke test (identical tier logic, checks, URLs) against
      # origin via SSH → localhost:3000, bypassing Cloudflare entirely.
      # Second arg overrides canonical host comparison: fetches from localhost
      # but validates canonicals against the production hostname.
      # Promoted to hard gate 2026-07-26: the old CDN-gated smoke test rolled
      # back healthy builds whenever Cloudflare bot-challenged the runner IP
      # (415 on `/` + 403 warm-up series, run 30208225666 — an IP-reputation
      # lottery, misdiagnosed for months as a "415 cold-start flake").
      # Rollback (step 12) and the success path (14b/15) key on THIS outcome.
      # continue-on-error is intentionally NOT set so the outcome is 'failure'.
      - name: Origin Smoke Test (via SSH) — deploy gate
        id: origin_smoketest
        if: steps.healthcheck.outcome == 'success'
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            scripts/smoke-test.mjs \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/sfp-smoke-test.mjs
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "node /tmp/sfp-smoke-test.mjs http://localhost:3000 ${{ secrets.NEXT_PUBLIC_SITE_URL }}; EXIT=\$?; rm -f /tmp/sfp-smoke-test.mjs; exit \$EXIT"

      # ── 11c. CDN Smoke Test — best-effort (NOT a gate) ────────
      # Same URLs through Cloudflare. Runner IPs get intermittently
      # bot-challenged (403/415) regardless of the smoke UA, so a failure here
      # proves nothing about the build — it is surfaced as a ::warning:: +
      # job-summary entry instead of triggering a rollback (rolling back the
      # origin can never fix a CDN-side challenge). If this stays red across
      # several deploys WITHOUT a 403 warm-up series, suspect a real edge
      # problem (2026-04-11 style poisoned cache) and check with ?cachebust=.
      - name: CDN Smoke Test (best-effort)
        id: smoketest
        if: steps.healthcheck.outcome == 'success'
        continue-on-error: true
        run: |
          sleep 5
          if node scripts/smoke-test.mjs ${{ secrets.NEXT_PUBLIC_SITE_URL }}; then
            echo "✅ CDN smoke test passed"
          else
            {
              echo "### ⚠️ CDN-Smoke-Test rot (best-effort, kein Gate)"
              echo ""
              echo "Der Smoke-Test über Cloudflare ist fehlgeschlagen — wahrscheinlichste Ursache ist eine Cloudflare-Bot-Challenge der GitHub-Runner-IP (403/415-Lotterie, siehe Run 30208225666)."
              echo "Deploy-Gate ist der Origin-Smoke-Test (SSH → localhost:3000); dieser war grün, sonst wäre zurückgerollt worden."
              echo ""
              echo "Bleibt dieser Check über mehrere Deploys rot, ohne dass der Warm-up eine 403-Serie meldet → echtes CDN-Problem möglich (Stil 2026-04-11, vergifteter Edge-Cache): \`curl -sI 'https://smartfinpro.com/?cachebust=123'\` prüfen."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=CDN smoke test failed (best-effort)::Likely Cloudflare bot challenge on the runner IP — the origin smoke test is the deploy gate"
            exit 1
          fi

      # ── 12. Auto-Rollback bei Fehler ─────────────────────────
      # always() ensures this runs even if a prior step crashed (not just 'failure' outcome).
      # Without always(), GitHub Actions skips subsequent steps after an unhandled step error.
      - name: Rollback on failure
        if: ${{ always() && (steps.healthcheck.outcome == 'failure' || steps.origin_smoketest.outcome == 'failure') }}
        run: |
          echo "🔄 Rolling back to previous version..."
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/master/applications/brvnvntpcj/public_html && \
             if [ -d .next/standalone-backup ]; then \
               rm -rf .next/standalone && \
               mv .next/standalone-backup .next/standalone && \
               export PM2=/home/master/.npm-global/bin/pm2 && \
               \$PM2 restart SmartFinPro-Live --update-env && \
               \$PM2 save && \
               echo '✅ Rollback complete, PM2 restarted'; \
             else \
               echo '❌ No backup found, cannot rollback'; \
             fi"

      # ── 13. Log failed deploy to dashboard ───────────────────
      - name: Log deploy failure to dashboard
        if: ${{ always() && (steps.healthcheck.outcome == 'failure' || steps.origin_smoketest.outcome == 'failure') }}
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://smartfinpro.com
        run: |
          PAYLOAD=$(jq -nc \
            --arg sha "${{ github.sha }}" \
            --arg msg "$COMMIT_MSG" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson run_id ${{ github.run_id }} \
            '{
              commit_sha: $sha,
              commit_message: ($msg | split("\n") | first | .[0:200]),
              branch: $branch,
              actor: $actor,
              status: "rolled_back",
              health_check: false,
              rollback: true,
              run_id: $run_id,
              run_url: $run_url
            }')
          curl -sf -X POST "${SITE_URL}/api/webhooks/github-deploy" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "⚠️ Dashboard webhook failed (non-critical)"

      # ── 14. Workflow als fehlgeschlagen markieren ─────────────
      - name: Fail workflow after rollback
        if: ${{ always() && (steps.healthcheck.outcome == 'failure' || steps.origin_smoketest.outcome == 'failure') }}
        run: exit 1

      # ── 14b. Purge Cloudflare cache ───────────────────────────
      # Runs only when health check + origin smoke test passed. Prevents stale CF
      # cache (e.g. cached error pages from origin hiccups) and guarantees
      # the next visitor gets a fresh response from the new build.
      # See scripts/purge-cloudflare.mjs for the rationale (2026-04-11 incident).
      - name: Purge Cloudflare cache
        if: steps.healthcheck.outcome == 'success' && steps.origin_smoketest.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/purge-cloudflare.mjs

      # ── 15. Log successful deploy to dashboard ──────────────
      - name: Log deploy success to dashboard
        if: steps.healthcheck.outcome == 'success' && steps.origin_smoketest.outcome == 'success'
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://smartfinpro.com
        run: |
          PAYLOAD=$(jq -nc \
            --arg sha "${{ github.sha }}" \
            --arg msg "$COMMIT_MSG" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --argjson run_id ${{ github.run_id }} \
            --argjson elapsed ${SECONDS:-0} \
            '{
              commit_sha: $sha,
              commit_message: ($msg | split("\n") | first | .[0:200]),
              branch: $branch,
              actor: $actor,
              status: "success",
              health_check: true,
              rollback: false,
              duration_s: $elapsed,
              run_id: $run_id,
              run_url: $run_url
            }')
          curl -sf -X POST "${SITE_URL}/api/webhooks/github-deploy" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "⚠️ Dashboard webhook failed (non-critical)"
